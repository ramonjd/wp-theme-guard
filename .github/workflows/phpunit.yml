name: PHPUnit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Composer dependencies inside wp-env container
        run: |
          npx wp-env start
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/nairobi composer install

      - name: Run PHPUnit
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/nairobi vendor/bin/phpunit
